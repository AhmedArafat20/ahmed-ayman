<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="orb o1"></div><div class="orb o2"></div>
<nav>

  <h1 id="name"></h1>
  <div id="role" data-t="role"></div>
  <div class="cta">
    <a class="btn mag p" id="b-cv" href="#" download data-t="b_cv"></a>
    <a class="btn mag" id="b-gh" href="#" target="_blank" rel="noopener" data-t="b_gh"></a>

<section id="about">
  <h2 class="rv" data-t="about_h"></h2>

    <div class="card spot rv"><h3 data-t="lang_h"></h3><div id="langs"></div></div>

<section id="skills">
  <h2 class="rv" data-t="skills_h"></h2>
  <div class="marquee rv"><div id="mq"></div></div>
  <div class="grid3" id="sk"></div>

<section id="projects">
  <h2 class="rv" data-t="proj_h"></h2>
  <p class="sub rv" data-t="proj_sub"></p>

<section id="certs">
  <h2 class="rv" data-t="cert_h"></h2>
  <p class="sub rv" data-t="cert_sub"></p>

<section id="contact">
